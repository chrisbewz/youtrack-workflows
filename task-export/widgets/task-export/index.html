<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Task export</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      min-height: 100%;
      margin: 0;
      padding: 20px;
      background: #ffffff;
      color: #1f2328;
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #task-preview { margin: 0 0 16px; }
    #task-preview h2 { margin: 0 0 8px; font-size: 14px; }
    #task-list { max-height: 140px; margin: 0; padding-left: 20px; overflow: auto; }
    #export-menu { display: inline-block; }
    #export-menu summary { min-height: 32px; border: 1px solid #1868db; border-radius: 4px; background: #1868db; color: #ffffff; padding: 6px 12px; font-weight: 500; cursor: pointer; }
    #task-export-actions { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
    #task-export-actions[hidden], #zip[hidden] { display: none !important; }
    #task-export-actions button {
      min-height: 32px;
      border: 1px solid #8c959f;
      border-radius: 4px;
      background: #f6f8fa;
      color: #1f2328;
      padding: 6px 12px;
      font: inherit;
      font-weight: 500;
      cursor: pointer;
    }
    #task-export-actions button.primary {
      border-color: #1868db;
      background: #1868db;
      color: #ffffff;
    }
    #task-export-actions button:focus-visible { outline: 2px solid #1868db; outline-offset: 2px; }
    #task-export-actions button:disabled { cursor: wait; opacity: .65; }
    #status { margin: 0 0 16px; }
    .warning { color: #9a6700; }
    @media (prefers-color-scheme: dark) {
      body { background: #1f2023; color: #f0f2f5; }
      #task-export-actions button { border-color: #6e7681; background: #2d3036; color: #f0f2f5; }
      #task-export-actions button.primary { border-color: #2f81f7; background: #2f81f7; color: #ffffff; }
      #task-export-actions button:focus-visible { outline-color: #58a6ff; }
      .warning { color: #e3b341; }
    }
  </style>
</head>
<body class="plugin">
  <p id="status" role="status" aria-live="polite">Loading export…</p>
  <section id="task-preview" hidden>
    <h2 id="task-list-heading">Tasks to export</h2>
    <ul id="task-list"></ul>
  </section>
  <details id="export-menu">
    <summary id="export-trigger">Export</summary>
    <div id="task-export-actions" hidden>
      <button id="markdown">Download Markdown</button>
      <button id="pdf">Download PDF</button>
      <button id="clipboard">Copy Markdown</button>
      <button id="zip" hidden>Download ZIP</button>
    </div>
  </details>
  <script src="client-export.js"></script>
  <script type="module">
    const status = document.getElementById('status');
    const actions = document.getElementById('task-export-actions');
    const zipButton = document.getElementById('zip');
    const taskPreview = document.getElementById('task-preview');
    const taskList = document.getElementById('task-list');
    const exportMenu = document.getElementById('export-menu');
    const messages = {
      en: {
        loading: 'Loading export…',
        markdown: 'Download Markdown',
        pdf: 'Download PDF',
        zip: 'Download ZIP',
        clipboard: 'Copy Markdown',
        copied: 'Markdown copied to the clipboard.',
        export: 'Export',
        taskList: 'Tasks to export',
        ready: count => count === 1 ? '1 task ready to export.' : count + ' tasks ready to export.',
        duplicateWarning: ' Duplicate references were skipped.',
        error: 'Unable to prepare the export. Try again or contact an administrator.',
        downloadError: 'Download failed. Please try again.'
      },
      pt: {
        loading: 'Preparando exportação…',
        markdown: 'Baixar Markdown',
        pdf: 'Baixar PDF',
        zip: 'Baixar ZIP',
        clipboard: 'Copiar Markdown',
        copied: 'Markdown copiado para a área de transferência.',
        export: 'Exportar',
        taskList: 'Tarefas para exportar',
        ready: count => count === 1 ? '1 tarefa pronta para exportação.' : count + ' tarefas prontas para exportação.',
        duplicateWarning: ' Referências duplicadas foram ignoradas.',
        error: 'Não foi possível preparar a exportação. Tente novamente ou contate um administrador.',
        downloadError: 'O download falhou. Tente novamente.'
      }
    };
    let text = messages.en;

    const download = (fileName, mimeType, content) => {
      const body = content instanceof Uint8Array ? content : new TextEncoder().encode(content);
      const blob = new Blob([body], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = fileName;
      anchor.hidden = true;
      document.body.append(anchor);
      anchor.click();
      setTimeout(() => {
        anchor.remove();
        URL.revokeObjectURL(url);
      }, 0);
    };

    const withBusyButton = (button, action) => {
      button.disabled = true;
      try {
        action();
      } catch (error) {
        status.classList.add('warning');
        status.textContent = text.downloadError;
        console.error('Task Export: download failed.', error);
      } finally {
        button.disabled = false;
      }
    };

    const copyMarkdown = async markdown => {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(markdown);
        return;
      }
      const textarea = document.createElement('textarea');
      textarea.value = markdown;
      textarea.style.position = 'fixed';
      document.body.append(textarea);
      textarea.select();
      const copied = document.execCommand('copy');
      textarea.remove();
      if (!copied) throw new Error('Clipboard access was denied.');
    };

    const initialize = async () => {
      const host = await YTApp.register();
      const locale = String(host.locale || 'en').toLowerCase();
      text = locale.startsWith('pt') ? messages.pt : messages.en;
      document.documentElement.lang = locale;
      document.title = locale.startsWith('pt') ? 'Exportar tarefa' : 'Task export';
      status.textContent = text.loading;
      document.getElementById('markdown').textContent = text.markdown;
      document.getElementById('pdf').textContent = text.pdf;
      zipButton.textContent = text.zip;
      document.getElementById('clipboard').textContent = text.clipboard;
      document.getElementById('export-trigger').textContent = text.export;
      document.getElementById('task-list-heading').textContent = text.taskList;

      const payload = await host.fetchApp('markdown-export-http/data', { scope: true });
      status.textContent = text.ready(payload.documents.length);
      if (payload.warnings.length) {
        status.classList.add('warning');
        status.textContent += text.duplicateWarning;
      }
      payload.documents.forEach(document => {
        const task = document.task || {};
        const item = document.createElement('li');
        item.textContent = task.idReadable && task.summary
          ? task.idReadable + ' — ' + task.summary
          : document.fileName;
        taskList.append(item);
      });
      taskPreview.hidden = false;
      actions.hidden = false;

      document.getElementById('markdown').onclick = () => withBusyButton(
        document.getElementById('markdown'),
        () => download(payload.documents.length === 1 ? payload.documents[0].fileName : 'tasks.md',
          'text/markdown; charset=utf-8', payload.markdown)
      );
      document.getElementById('pdf').onclick = () => withBusyButton(
        document.getElementById('pdf'),
        () => download(payload.issue.idReadable + '-tasks.pdf', 'application/pdf',
          TaskExportClient.createPdfBytes(payload.markdown))
      );
      document.getElementById('clipboard').onclick = async () => {
        const button = document.getElementById('clipboard');
        button.disabled = true;
        try {
          await copyMarkdown(payload.markdown);
          status.classList.remove('warning');
          status.textContent = text.copied;
          exportMenu.open = false;
        } catch (error) {
          status.classList.add('warning');
          status.textContent = text.downloadError;
          console.error('Task Export: clipboard copy failed.', error);
        } finally {
          button.disabled = false;
        }
      };
      if (payload.separateFilesForMultipleTasks && payload.documents.length > 1) {
        zipButton.hidden = false;
        zipButton.onclick = () => withBusyButton(
          zipButton,
          () => download(payload.issue.idReadable + '-tasks.zip', 'application/zip',
            TaskExportClient.createZipBytes(payload.documents))
        );
      }
    };

    initialize().catch(error => {
      status.classList.add('warning');
      status.textContent = text.error;
      console.error('Task Export: failed to load export data.', error);
    });
  </script>
</body>
</html>
